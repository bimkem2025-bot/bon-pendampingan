<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifikasi tanda tangan elektronik</title>
<style>body{font:16px/1.6 system-ui,Segoe UI,Arial,sans-serif;background:#f6f7f8;color:#1f2937;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}
.c{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:28px 30px;max-width:440px;margin:16px}h1{font-size:18px;margin:0 0 4px}.ok{color:#2f6b45;font-weight:600}dl{margin:16px 0 0}dt{font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}dd{margin:0 0 10px;font-weight:600}.m{color:#6b7280;font-size:13px}</style></head>
<body><div class="c"><h1>Tanda tangan elektronik</h1><div id="r"></div></div>
<script>
const q = new URLSearchParams(location.search), pk = q.get('pk'), t = q.get('tgl'), i = q.get('id');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const B = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const f = d => { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(d || ''); return m ? +m[3] + ' ' + B[+m[2] - 1] + ' ' + m[1] : d; };
document.getElementById('r').innerHTML = pk && t ? `<div class="ok">✓ Laporan pendampingan ini ditandatangani secara elektronik</div><dl><dt>Penandatangan</dt><dd>${esc(pk)}</dd><dt>Tanggal laporan</dt><dd>${esc(f(t))}</dd><dt>Instansi</dt><dd>Balai Pemasyarakatan Kelas II Sintang</dd>${i ? `<dt>Kode dokumen</dt><dd>${esc(i)}</dd>` : ''}</dl><p class="m">Cocokkan data di atas dengan yang tercetak pada cap di dokumen.</p>` : '<p>Data verifikasi tidak ditemukan.</p>';
</script></body></html>
